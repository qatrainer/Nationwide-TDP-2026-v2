# NW TDP 2026 v2
name: DevSecOps Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-build-test:
    name: Python build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest ../../tests/python -q
      - name: Dependency vulnerability scan (SCA)
        run: pip install pip-audit && pip-audit -r requirements.txt

  dotnet-build-test:
    name: C# build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/csharp/Nationwide.Api.Tests/Nationwide.Api.Tests.csproj
      - run: dotnet build tests/csharp/Nationwide.Api.Tests/Nationwide.Api.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/csharp/Nationwide.Api.Tests/Nationwide.Api.Tests.csproj --no-build --configuration Release
      - name: Dependency vulnerability scan (SCA)
        run: dotnet list tests/csharp/Nationwide.Api.Tests/Nationwide.Api.Tests.csproj package --vulnerable --include-transitive

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  dast:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: [python-build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Start API
        working-directory: api/python
        run: |
          python -m pip install -r requirements.txt
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/nationwide-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/nationwide-api.log
          exit 1
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8000'
          fail_action: false
          allow_issue_writing: false

  deploy-gate:
    name: Deployment gate
    runs-on: ubuntu-latest
    needs: [python-build-test, dotnet-build-test, sast, dast]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - run: echo "Checks completed. Configure a protected deployment environment before adding deployment credentials and deployment steps."
